permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
  # every morning
  - cron: '0 1 * * *'
name: readme
jobs:
  update:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'googleapis'
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'
        architecture: 'x64'
    - run: python3 -m pip install --require-hashes -r .github/requirements.txt
    - run: python3 generate-readme.py
    - name: Commit and Create PR
      env:
        GH_TOKEN: ${{ secrets.CLOUD_JAVA_BOT_GITHUB_TOKEN }}
      run: |
        git add README.md
        if git diff --cached --quiet; then
          echo "No changes in README.md"
          exit 0
        fi
        git config user.email "cloud-java-bot@google.com"
        git config user.name "Cloud Java Bot"
        git checkout -B update-readme
        git commit -m "chore: regenerate client table in README"
        git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
        git push -f origin update-readme
        pr_num=$(gh pr list -s open -H update-readme --json number --jq '.[0].number // empty')
        if [ -z "${pr_num}" ]; then
          gh pr create --base main --head update-readme --title "chore: regenerate client table in README" --body "ran python3 generate-readme.py"
        else
          echo "Updated existing PR #${pr_num}"
        fi
