# Github action job to test core java library features on
# downstream client libraries before they are released.
permissions:
  contents: read

on:
  push:
    branches:
    - main
  pull_request:
name: versions check
jobs:
  unmanaged-versions-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      with:
        persist-credentials: false
    - run: ./generation/check_non_release_please_versions.sh

  # For Release Please pull requests, the artifacts being published must not
  # have the duplicate versions in Maven Central or "SNAPSHOT" versions.
  # When Release Please switches non-SNAPSHOT versions to SNAPSHOT versions,
  # this check should be skipped. Note that the "autorelease: snapshot" label
  # was added after the pull request is created.
  existing-versions-check:
    runs-on: ubuntu-latest
    if: |
      github.repository_owner == 'googleapis' && github.head_ref == 'release-please--branches--main' &&
      !endsWith(github.event.pull_request.title, 'SNAPSHOT')
    steps:
    - name: Install xmllint
      timeout-minutes: 5
      run: |
        # Retry apt-get update and install up to 3 times with a 15-second per-request timeout.
        # Retries protect against transient network glitches, mirror timeouts, and apt lock contention on runner startup.
        for i in {1..3}; do
          sudo apt-get -o Acquire::http::Timeout="15" -o Acquire::Retries=3 update && \
          sudo apt-get -o Acquire::http::Timeout="15" -o Acquire::Retries=3 -y install libxml2-utils && \
          break || sleep 5
        done
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      with:
        persist-credentials: false
    - run: ./generation/check_existing_release_versions.sh
