# Verbose logging configuration used by enable-verbose-grpc-logs profile.
# Scoped to Bigtable/gRPC/GAX diagnostic loggers rather than global .level=FINEST so that
# multi-hundred-MB xDS/load-balancer endpoint dumps don't OOM Kokoro's Sponge XML parser.
handlers= java.util.logging.ConsoleHandler
.level= INFO

# Bigtable client & session logs
com.google.cloud.bigtable.level= FINEST
# hide "Connecting to the Bigtable emulator at localhost:XXXX" lines
com.google.cloud.bigtable.data.v2.BigtableDataSettings.level= WARNING

# GAX channel pool & retry diagnostics
com.google.api.gax.level= FINE

# gRPC transport, channel, and DirectPath diagnostics
io.grpc.level= FINE
# ChannelLogger: FINER = ChannelLogLevel.INFO/WARNING/ERROR (subchannel & transport lifecycle).
# Avoid FINEST (DEBUG), which dumps full resolved-address / XdsConfig payloads on every update.
io.grpc.ChannelLogger.level= FINER
# ProtocolNegotiators: FINER logs ALTS/TLS handshake details for DirectPath debugging.
io.grpc.netty.shaded.io.grpc.netty.ProtocolNegotiators.level= FINER
# XdsLogger: FINE = XdsLogLevel.WARNING/ERROR/FORCE_*.
# Avoid FINER/FINEST, which dump full xDS DiscoveryResponse/XdsConfig/EDS endpoint payloads.
io.grpc.xds.XdsLogger.level= FINE
# Suppress verbose endpoint-list dumps and Netty internals / per-frame HTTP/2 dumps.
io.grpc.util.MultiChildLoadBalancer.level= INFO
io.grpc.netty.shaded.io.netty.level= INFO

java.util.logging.ConsoleHandler.level = FINEST

java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
# [YYYY-MM-DD HH:MM:SS.sss] [level] (loggerName): message
java.util.logging.SimpleFormatter.format=[%1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS.%1$tL.%1$tN] [%4$-7s] (%2$s): %5$s%n
